readme = "README.md"
authors = [
    { name = "Mingkwan Rattanasiwamok", email = "mingkwan.ratta@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "jax>=0.11.0",
    "jaxopt>=0.8.5",
